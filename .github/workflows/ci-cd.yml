name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------- CI
  ci:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskmanager
          POSTGRES_PASSWORD: taskmanager
          POSTGRES_DB: taskmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskmanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://taskmanager:taskmanager@localhost:5432/taskmanager?schema=public
      JWT_SECRET: ci-only-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Apply schema to test DB and seed
        run: |
          npx prisma db push --skip-generate
          npm run db:seed

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------- Deploy (pm2)
  deploy:
    name: Deploy to Server (pm2)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Pull, build and reload on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PM2_APP_NAME: ${{ secrets.PM2_APP_NAME || 'taskmanager' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH,PM2_APP_NAME
          command_timeout: 20m
          script: |
            set -e

            # Non-interactive SSH doesn't load the login profile; pick up nvm if Node was installed with it.
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            [ -n "$DEPLOY_PATH" ] || { echo "DEPLOY_PATH secret is not set"; exit 1; }
            cd "$DEPLOY_PATH"
            [ -f .env ] || { echo ".env is missing in $(pwd)"; exit 1; }

            echo "==> git pull"
            git pull --ff-only origin main

            echo "==> npm ci"
            npm ci

            echo "==> prisma db push"
            npx prisma db push --skip-generate

            echo "==> build"
            npm run build

            echo "==> pm2 reload $PM2_APP_NAME"
            if pm2 describe "$PM2_APP_NAME" > /dev/null 2>&1; then
              pm2 reload "$PM2_APP_NAME" --update-env
            else
              pm2 start npm --name "$PM2_APP_NAME" -- start
            fi
            pm2 save

            echo "==> deployed $(git rev-parse --short HEAD)"
